<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RacleAlbum - Your Personal Photo & Text Space</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar">
    <div class="nav-brand">RacleAlbum</div>
    <div class="nav-links" id="navLinks">
      <button class="nav-btn" onclick="showSection('gallery')">Gallery</button>
      <button class="nav-btn" onclick="showSection('upload')">Upload</button>
      <button class="nav-btn primary" id="authBtn" onclick="showSection('auth')">Login</button>
    </div>
  </nav>

  <!-- Landing / Auth Section -->
  <section id="auth" class="section active">
    <div class="auth-container">
      <div class="auth-card">
        <h1>RacleAlbum</h1>
        <p class="subtitle">Secure Photo & Data Interface // Access Anywhere</p>

        <div class="tabs">
          <button class="tab active" onclick="switchTab('login')">Login</button>
          <button class="tab" onclick="switchTab('register')">Register</button>
        </div>

        <!-- Login Form -->
        <form id="loginForm" class="auth-form" onsubmit="handleLogin(event)">
          <div class="form-group">
            <label>Identity // Email</label>
            <input type="email" id="loginEmail" placeholder="user@network.com" required>
          </div>
          <div class="form-group">
            <label>Access Key // Password</label>
            <input type="password" id="loginPassword" placeholder="••••••••" required>
          </div>
          <button type="submit" class="btn primary full">Initialize Session</button>
        </form>

        <!-- Register Form -->
        <form id="registerForm" class="auth-form hidden" onsubmit="handleRegister(event)">
          <div class="form-group">
            <label>Codename // Name</label>
            <input type="text" id="regName" placeholder="Your identifier" required>
          </div>
          <div class="form-group">
            <label>Identity // Email</label>
            <input type="email" id="regEmail" placeholder="user@network.com" required>
          </div>
          <div class="form-group">
            <label>Access Key // Password</label>
            <input type="password" id="regPassword" placeholder="Minimum 6 characters" required minlength="6">
          </div>
          <button type="submit" class="btn primary full">Create Identity</button>
        </form>

        <p class="note">Encrypted • Private • Free Tier</p>
      </div>
    </div>
  </section>

  <!-- Gallery Section -->
  <section id="gallery" class="section">
    <div class="container">
      <div class="section-header">
        <h2>Your Gallery</h2>
        <button class="btn" onclick="showSection('upload')">+ Add New</button>
      </div>
      <div id="galleryGrid" class="gallery-grid">
        <!-- Items will be loaded here -->
        <div class="empty-state">
          <p>No photos or notes yet.</p>
          <button class="btn primary" onclick="showSection('upload')">Upload your first item</button>
        </div>
      </div>
    </div>
  </section>

  <!-- Upload Section -->
  <section id="upload" class="section">
    <div class="container">
      <div class="section-header">
        <h2>Upload</h2>
        <button class="btn" onclick="showSection('gallery')">← Back to Gallery</button>
      </div>

      <div class="upload-card">
        <form id="uploadForm" onsubmit="handleUpload(event)">
          <div class="form-group">
            <label>Title / Caption</label>
            <input type="text" id="itemTitle" placeholder="What is this about?" required>
          </div>

          <div class="form-group">
            <label>Text / Note (optional)</label>
            <textarea id="itemText" rows="4" placeholder="Write something..."></textarea>
          </div>

          <div class="form-group">
            <label>Photo (optional)</label>
            <div class="file-drop" id="fileDrop">
              <input type="file" id="itemPhoto" accept="image/*" onchange="previewPhoto(event)">
              <div class="drop-content">
                <span>📷</span>
                <p>Click or drag a photo here</p>
              </div>
            </div>
            <img id="photoPreview" class="photo-preview hidden" alt="Preview">
          </div>

          <button type="submit" class="btn primary full">Save to Album</button>
        </form>
      </div>
    </div>
  </section>

  <script src="app.js"></script>
</body>
</html>
