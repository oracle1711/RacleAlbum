<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RacleAlbum - Your Personal Photo Space</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Live Sci-Fi Background -->
  <canvas id="bgCanvas"></canvas>

  <!-- Navigation -->
  <nav class="navbar">
    <div class="nav-brand" onclick="showSection(currentUser ? 'gallery' : 'auth')">RacleAlbum</div>
    <div class="nav-links" id="navLinks">
      <button class="nav-btn" id="galleryNavBtn" onclick="showSection('gallery')" style="display:none">Home</button>
      <button class="nav-btn primary" id="authBtn" onclick="showSection('auth')">Login</button>
    </div>
  </nav>

  <!-- Landing / Auth Section -->
  <section id="auth" class="section active">
    <div class="auth-container">
      <div class="auth-card">
        <h1>RacleAlbum</h1>
        <p class="subtitle">Secure Photo & Data Interface // Access Anywhere</p>

        <div class="tabs">
          <button class="tab active" onclick="switchTab('login')">Login</button>
          <button class="tab" onclick="switchTab('register')">Register</button>
        </div>

        <form id="loginForm" class="auth-form" onsubmit="handleLogin(event)">
          <div class="form-group">
            <label>Identity // Email</label>
            <input type="email" id="loginEmail" placeholder="user@network.com" required>
          </div>
          <div class="form-group">
            <label>Access Key // Password</label>
            <input type="password" id="loginPassword" placeholder="••••••••" required>
          </div>
          <button type="submit" class="btn primary full">Initialize Session</button>
        </form>

        <form id="registerForm" class="auth-form hidden" onsubmit="handleRegister(event)">
          <div class="form-group">
            <label>Codename // Name</label>
            <input type="text" id="regName" placeholder="Your identifier" required>
          </div>
          <div class="form-group">
            <label>Identity // Email</label>
            <input type="email" id="regEmail" placeholder="user@network.com" required>
          </div>
          <div class="form-group">
            <label>Access Key // Password</label>
            <input type="password" id="regPassword" placeholder="Minimum 6 characters" required minlength="6">
          </div>
          <button type="submit" class="btn primary full">Create Identity</button>
        </form>

        <p class="note">Encrypted • Private • Free Tier</p>
      </div>
    </div>
  </section>

  <!-- Pinterest-style Gallery (logged in) -->
  <section id="gallery" class="section">
    <div class="pin-header">
      <h1 class="pin-title">Racle Album</h1>
      <p class="pin-subtitle" id="pinSubtitle">Your personal board</p>
    </div>

    <div id="galleryGrid" class="pin-grid">
      <!-- Pins + empty upload slots rendered by JS -->
    </div>

    <!-- Hidden file input for quick upload from empty slots -->
    <input type="file" id="quickPhoto" accept="image/*" style="display:none" onchange="quickUpload(event)">
  </section>

  <!-- Upload modal / section (kept simple) -->
  <section id="upload" class="section">
    <div class="container">
      <div class="section-header">
        <h2>Add to Racle Album</h2>
        <button class="btn" onclick="showSection('gallery')">← Back</button>
      </div>

      <div class="upload-card">
        <form id="uploadForm" onsubmit="handleUpload(event)">
          <div class="form-group">
            <label>Title / Caption</label>
            <input type="text" id="itemTitle" placeholder="Give it a title..." required>
          </div>

          <div class="form-group">
            <label>Note (optional)</label>
            <textarea id="itemText" rows="3" placeholder="Add a note..."></textarea>
          </div>

          <div class="form-group">
            <label>Photo</label>
            <div class="file-drop" id="fileDrop">
              <input type="file" id="itemPhoto" accept="image/*" onchange="previewPhoto(event)">
              <div class="drop-content">
                <span>📷</span>
                <p>Click or drag a photo here</p>
              </div>
            </div>
            <img id="photoPreview" class="photo-preview hidden" alt="Preview">
          </div>

          <button type="submit" class="btn primary full">Save to Album</button>
        </form>
      </div>
    </div>
  </section>

  <script src="app.js"></script>
</body>
</html>
